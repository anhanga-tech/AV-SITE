<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--av-cream); }
  body { padding: 24px; font-family: var(--av-font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .group { background: white; border: 1px solid var(--av-border); border-radius: 16px; padding: 14px; }
  .family { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; color: var(--av-fg-3); margin-bottom: 8px; }
  .swatch-row { display: flex; gap: 6px; }
  .sw { width: 100%; height: 36px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.05); }
  .hex { font-family: var(--av-font-mono); font-size: 10px; color: var(--av-fg-3); margin-top: 6px; }
</style></head>
<body>
<div class="grid">
  <div class="group">
    <div class="family">Orange · concierge</div>
    <div class="swatch-row">
      <div class="sw" style="background:#ffedd5"></div>
      <div class="sw" style="background:#fed7aa"></div>
      <div class="sw" style="background:#ea580c"></div>
    </div>
    <div class="hex">100 / 200 / 600</div>
  </div>
  <div class="group">
    <div class="family">Sky · action</div>
    <div class="swatch-row">
      <div class="sw" style="background:#f0f9ff"></div>
      <div class="sw" style="background:#bae6fd"></div>
      <div class="sw" style="background:#0ea5e9"></div>
    </div>
    <div class="hex">50 / 200 / 500</div>
  </div>
  <div class="group">
    <div class="family">Emerald · achados</div>
    <div class="swatch-row">
      <div class="sw" style="background:#d1fae5"></div>
      <div class="sw" style="background:#a7f3d0"></div>
      <div class="sw" style="background:#059669"></div>
    </div>
    <div class="hex">100 / 200 / 600</div>
  </div>
  <div class="group">
    <div class="family">Blue · zero burocracia</div>
    <div class="swatch-row">
      <div class="sw" style="background:#dbeafe"></div>
      <div class="sw" style="background:#bfdbfe"></div>
      <div class="sw" style="background:#2563eb"></div>
    </div>
    <div class="hex">100 / 200 / 600</div>
  </div>
  <div class="group">
    <div class="family">Yellow · tape / sticker</div>
    <div class="swatch-row">
      <div class="sw" style="background:#fefce8"></div>
      <div class="sw" style="background:#fef08a"></div>
      <div class="sw" style="background:#fde047"></div>
    </div>
    <div class="hex">50 / 200 / 300</div>
  </div>
  <div class="group">
    <div class="family">Red · pin · highlight</div>
    <div class="swatch-row">
      <div class="sw" style="background:#fecaca"></div>
      <div class="sw" style="background:#f87171"></div>
      <div class="sw" style="background:#ef4444"></div>
    </div>
    <div class="hex">200 / 400 / 500</div>
  </div>
  <div class="group">
    <div class="family">Green · confirm</div>
    <div class="swatch-row">
      <div class="sw" style="background:#dcfce7"></div>
      <div class="sw" style="background:#4ade80"></div>
      <div class="sw" style="background:#22c55e"></div>
    </div>
    <div class="hex">100 / 400 / 500</div>
  </div>
  <div class="group">
    <div class="family">Dark · text / footer</div>
    <div class="swatch-row">
      <div class="sw" style="background:#334155"></div>
      <div class="sw" style="background:#1e293b"></div>
      <div class="sw" style="background:#0f172a"></div>
    </div>
    <div class="hex">700 / 800 / 900</div>
  </div>
</div>
</body></html>
