<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=700">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--av-cream); }
  body { padding: 32px; font-family: var(--av-font-body); display:flex; flex-direction:column; gap: 22px; }
  .label { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .18em; color: var(--av-fg-3); margin-bottom: 6px; }
  .quote {
    font-family: 'Merriweather', Georgia, serif;
    font-style: italic;
    font-size: 28px;
    line-height: 1.35;
    color: var(--av-dark);
    letter-spacing: -.01em;
    max-width: 620px;
  }
  .quote::before { content:"\201C"; color: var(--av-yellow); font-size: 56px; font-family: 'Merriweather', Georgia, serif; vertical-align: -.2em; margin-right: 4px; }
  .attrib { font-family: var(--av-font-display); font-weight: 700; color: var(--av-fg-2); font-size: 14px; margin-top: 8px; font-style: normal; letter-spacing: .02em; }
  .attrib span { font-weight: 400; color: var(--av-fg-3);}
  .mono {
    font-family: var(--av-font-mono);
    font-size: 13px;
    background: white;
    border: 1px solid var(--av-border);
    border-radius: 10px;
    padding: 10px 12px;
    display: inline-block;
    color: var(--av-fg-1);
  }
</style></head>
<body>
  <div>
    <div class="label">Merriweather italic · pull-quote · 28 / 1.35</div>
    <p class="quote">A Anhangá não vendeu uma viagem. Montou a nossa lua-de-mel como se fosse pra eles mesmos.</p>
    <div class="attrib">Carolina &amp; Pedro &middot; <span>Patagônia, 2024</span></div>
  </div>
  <div>
    <div class="label">Mono · specs &amp; kbd shortcuts</div>
    <span class="mono">⌘K &nbsp;/&nbsp; font-mono · ui-monospace</span>
  </div>
</body></html>
