<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=760">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--av-cream); }
  body { padding: 28px; font-family: var(--av-font-body); display:flex; flex-direction:column; gap: 22px; }
  .label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .16em; color: var(--av-fg-3); }

  .logos {
    display:grid; grid-template-columns: 1fr 1fr; gap: 18px;
  }
  .logo-tile {
    border: 1px solid var(--av-border);
    border-radius: 20px;
    background: white;
    padding: 26px;
    display: flex; align-items: center; justify-content: center;
    min-height: 150px;
  }
  .logo-tile.dark { background: var(--av-dark); }
  .logo-tile img { max-width: 80%; max-height: 90px; display:block;}
  .caption { font-family: var(--av-font-mono); font-size: 11px; color: var(--av-fg-3); margin-top: 8px; text-align:center;}

  /* Tape / stamp / scribble strip */
  .deco-row { display:flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .tape {
    background: rgba(254, 249, 195, 0.92);
    padding: 10px 24px;
    font-family: 'Merriweather', serif; font-style: italic;
    color: var(--av-dark); font-size: 14px;
    transform: rotate(-2.5deg);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    border-left: 2px solid rgba(255,255,255,.7);
    border-right: 2px solid rgba(255,255,255,.7);
  }
  .stamp {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 3px dashed var(--av-dark);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family: var(--av-font-display);
    font-weight: 800; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--av-dark);
    background: var(--av-yellow);
    transform: rotate(-8deg);
  }
  .scribble {
    font-family: var(--av-font-display);
    font-weight: 800; font-size: 28px; color: var(--av-dark);
    position: relative; padding: 0 4px;
  }
  .scribble span { position: relative; z-index: 1;}
  .scribble::before {
    content:""; position:absolute; left: -2px; right:-2px; bottom: 6px; height: 12px;
    background: var(--av-yellow); z-index: 0; transform: skew(-6deg) rotate(-1deg);
  }
</style></head>
<body>
  <div>
    <div class="label" style="margin-bottom: 12px;">Logos</div>
    <div class="logos">
      <div>
        <div class="logo-tile"><img src="../assets/logo-anhanga-viagens-azul.svg" alt="Anhangá Viagens — azul"></div>
        <div class="caption">logo-anhanga-viagens-azul.svg · bg ≥ #F4F8FF</div>
      </div>
      <div>
        <div class="logo-tile dark"><img src="../assets/logo-anhanga-viagens-branco.svg" alt="Anhangá Viagens — branco"></div>
        <div class="caption">logo-anhanga-viagens-branco.svg · bg escuro</div>
      </div>
    </div>
  </div>

  <div>
    <div class="label" style="margin-bottom: 12px;">Decorations · tape · stamp · scribble highlight</div>
    <div class="deco-row">
      <span class="tape">"feito no tempo de vocês"</span>
      <div class="stamp">ACHADO<br>ANHANGÁ</div>
      <span class="scribble"><span>Sua próxima aventura.</span></span>
    </div>
  </div>
</body></html>
