name = "av-site"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Environment variables and secrets are configured in the Cloudflare dashboard
# (Settings > Environment Variables) — NOT in this file.
# Required for production:
#   GEMINI_API_KEY, HUBSPOT_TOKEN, N8N_WEBHOOK_SECRET,
#   N8N_SUBMIT_LEAD_WEBHOOK_URL, N8N_SUBMIT_CONTACT_WEBHOOK_URL,
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
