  <script>
    window.traks = window.traks || function () {
      (window.traks.q = window.traks.q || []).push(arguments);
    };
    // Não carregar o coletor do Traks em ambientes não-produtivos (dev local +
    // Playwright/CI em 127.0.0.1) — mesmo gate de host do GTM/Mautic mais abaixo:
    // sem isso, cliques/submits de teste poluem quote_request/whatsapp_click/
    // page_not_found de produção. O stub acima continua definido para não
    // quebrar trackTraks() — os eventos só ficam enfileirados em window.traks.q
    // sem nunca serem enviados.
    (function () {
      var h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '::1' || h === '0.0.0.0' || h.endsWith('.local') || h.endsWith('.test')) return;
      var injectTraks = function () {
        var script = document.createElement('script');
        // async = false (não .defer, que scripts criados via createElement ignoram)
        // dá execução em ordem, mas sozinho não replica a garantia de defer de
        // esperar o parse do documento terminar — por isso o gate de
        // DOMContentLoaded abaixo, que é o que efetivamente restaura o
        // comportamento da tag estática original (<script defer>).
        script.async = false;
        script.setAttribute('data-site', 'pb_live_y0tnugik6s7s2b0iy73w5aim');
        script.src = 'https://analytics-collect.anhanga.tur.br/t.js';
        document.head.appendChild(script);
      };
      // Este bloco roda no topo do <head>, durante o parse — document.readyState
      // ainda é 'loading' aqui. Esperar DOMContentLoaded (que só dispara depois do
      // parse completo) garante que o coletor não injete no meio do parsing, igual
      // a <script defer> fazia. Se por algum motivo já estiver 'interactive'/
      // 'complete' quando este código rodar, o parse já terminou — injeta direto.
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', injectTraks, { once: true });
      } else {
        injectTraks();
      }
    })();
  </script>

<body>
  <!-- GTM noscript removido (auditoria LGPD jul/2026): carregava tags sem os defaults
       do Consent Mode (setados via JS) e a SPA não renderiza sem JS de qualquer forma. -->
  <div id="root"></div>
  <script>window.dataLayer = window.dataLayer || [];</script>
  <script>
    window.dataLayer = window.dataLayer || [];
    // Required by the deferred UTM tracker to query the GA4 client_id.
    function gtag() { dataLayer.push(arguments); }
  </script>
  <script type="module" src="/index.tsx"></script>
  <!-- Defer third-party scripts to protect mobile TBT -->
  <script>
    (function () {
      var _consentChoice = (function () { try { return localStorage.getItem('anhanga_cookie_consent'); } catch (e) { return null; } })();
      var analyticsLoaded = false;
      var gtmLoaded = false;
      var utmLoaded = false;
      var consentListeners = [];

      var callConsentListener = function (callback, choice) {
        try {
          callback(choice);
        } catch (error) {
          console.error('Anhangá consent listener failed', error);
        }
      };

      window.addAnhangaConsentListener = function (callback) {
        if (typeof callback !== 'function') return;
        consentListeners.push(callback);
        callConsentListener(callback, _consentChoice);
      };

      var notifyConsentListeners = function (choice) {
        consentListeners.slice().forEach(function (callback) {
          callConsentListener(callback, choice);
        });
      };

      window.dataLayer.push({
        anhanga_marketing_consent: _consentChoice === 'marketing'
      });

      // Zaraz é fail-open por padrão (tool sem purpose dispara sem gate) — a
      // purpose 'marketing' só existe pra gatear Meta/TikTok quando essas tools
      // forem adicionadas (Tasks 4/5 do plano de migração). GA4 não tem purpose
      // de propósito, pra preservar o comportamento atual de legítimo interesse.
      //
      // Assina a ponte em vez de chamar o Zaraz direto dentro dos listeners de
      // aceite/revogação: addAnhangaConsentListener já invoca o callback com o
      // estado atual no registro (cobre quem já tinha consentido em visita
      // anterior) e de novo a cada mudança futura — os listeners de DOM abaixo
      // são { once: true }, então uma chamada direta ali só cobriria o clique
      // em si, nunca uma visita de retorno com consentimento já persistido.
      var pendingZarazMarketing = null;
      // "true" precisa dizer "nada pendente pro Zaraz agora", não só "chegou a enviar
      // alguma vez" — por isso os dois `return` abaixo são separados. Um único `||`
      // combinando "nada pendente" com "zaraz não está pronto" faz os dois casos
      // devolverem `false` do mesmo jeito, e reloadAfterZarazFlush (mais abaixo) não
      // consegue diferenciar "já sincronizado, pode recarregar" de "ainda esperando o
      // zaraz.js carregar" — no caminho comum (zaraz já carregado antes da revogação),
      // isso forçava a esperar o teto inteiro de ~1,2s à toa (achado de review).
      var flushZarazConsent = function () {
        if (pendingZarazMarketing === null) return true;
        if (!window.zaraz || !window.zaraz.consent) return false;
        window.zaraz.consent.set({ marketing: pendingZarazMarketing });
        pendingZarazMarketing = null;
        return true;
      };
      window.addAnhangaConsentListener(function (choice) {
        pendingZarazMarketing = choice === 'marketing';
        if (flushZarazConsent()) return;
        // zaraz.js carrega assíncrono — se ainda não chegou no momento do clique,
        // tenta de novo por até 10s em vez de descartar o consentimento em silêncio.
        var attempts = 0;
        var retryTimer = setInterval(function () {
          attempts += 1;
          if (flushZarazConsent() || attempts >= 20) clearInterval(retryTimer);
        }, 500);
      });

      // A revogação recarrega a página logo em seguida — um reload síncrono destruiria
      // este documento antes do retryTimer acima ter qualquer chance de rodar, e o Zaraz
      // reaplicaria o 'marketing: true' persistido da visita anterior na página recarregada
      // até essa ponte corrigir de novo. Adia o reload por até ~1,2s dando chance ao flush
      // acontecer primeiro; não trava a UI por mais que isso — passado o teto, recarrega de
      // qualquer forma (o risco residual é o mesmo já aceito no resto desta ponte).
      var reloadAfterZarazFlush = function () {
        if (flushZarazConsent()) {
          window.location.reload();
          return;
        }
        var attempts = 0;
        var waitTimer = setInterval(function () {
          attempts += 1;
          if (flushZarazConsent() || attempts >= 6) {
            clearInterval(waitTimer);
            window.location.reload();
          }
        }, 200);
      };

      var injectScript = function (src, options) {
        var script = document.createElement('script');
        script.src = src;
        script.async = true;
        if (options && options.defer) script.defer = true;
        if (options && options.id) script.id = options.id;
        if (options && options.type) script.type = options.type;
        document.body.appendChild(script);
      };

      var loadGtm = function () {
        if (gtmLoaded) return;
        gtmLoaded = true;
        // Não carregar GTM em ambientes não-produtivos (dev local + Playwright/CI em 127.0.0.1).
        // Sem este gate, submits de teste disparam generate_lead -> GTM -> GA4 de produção e
        // poluem o sinal de conversão (treina o Smart Bidding com tráfego de bot).
        var h = location.hostname;
        if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '::1' || h === '0.0.0.0' || h.endsWith('.local') || h.endsWith('.test')) return;
        window.dataLayer.push({
          'gtm.start': new Date().getTime(),
          event: 'gtm.js'
        });
        injectScript('https://load.sst.anhanga.tur.br/60oxrlttgl.js?56lu7e=BQNJMzg%2FVTteLDMnVEQ%2FSRpaRlpdVBwBUQYaHA0cHw5CEwEGQhAK');
      };

      var absoluteFallbackTimer = null;
      var loadAnalytics = function () {
        if (analyticsLoaded) return;
        analyticsLoaded = true;
        if (absoluteFallbackTimer !== null) clearTimeout(absoluteFallbackTimer);
        loadGtm();
        if (!utmLoaded) {
          utmLoaded = true;
          injectScript('/utm-tracking.js', { defer: true });
        }
      };

      var triggerAnalytics = function () {
        loadAnalytics();
      };

      ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function (eventName) {
        window.addEventListener(eventName, triggerAnalytics, { passive: true, once: true });
      });

      // Fallback para sessões sem interação: dispara no primeiro tempo ocioso após o load.
      // ANTES havia um atraso fixo de ~12s. Em testes de laboratório (Lighthouse/PageSpeed com
      // throttling simulado) esse atraso empurrava a atividade dos scripts de terceiros para
      // DENTRO da janela de medição, fixando TTI/TBT em ~12s (issue #1259). O LCP é o hero
      // pré-renderizado, já pintado bem antes disso, então adiar só até o primeiro ocioso
      // pós-load protege o LCP/TBT reais, encurta a janela do lab e ainda cobre analytics de
      // quem não interage (na prática, captura MAIS sessões que dão bounce antes dos 12s).
      var scheduleFallback = function () {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(triggerAnalytics, { timeout: 4000 });
        } else {
          setTimeout(triggerAnalytics, 4000);
        }
      };
      if (document.readyState === 'complete') {
        scheduleFallback();
      } else {
        window.addEventListener('load', scheduleFallback, { once: true });
      }
      // Teto absoluto INDEPENDENTE do 'load': em rotas com iframe/tiles do Leaflet (ex.:
      // /lollapalooza) o evento 'load' pode atrasar ou nunca disparar se um terceiro travar —
      // sem este backstop, sessões sem interação lá deixariam de gerar analytics. É idempotente
      // (loadAnalytics é guardado por analyticsLoaded), então no caminho normal o path ocioso
      // pós-load já rodou antes dos 10s e este timer é limpo em loadAnalytics — não reintroduz
      // o pinning de ~12s no lab, onde 'load' dispara cedo e o analytics carrega no primeiro ocioso.
      absoluteFallbackTimer = setTimeout(triggerAnalytics, 10000);

      window.addEventListener('anhanga:marketing-consent', function () {
        _consentChoice = 'marketing';
        notifyConsentListeners('marketing');
        window.dataLayer.push({
          event: 'marketing_consent_granted',
          anhanga_marketing_consent: true
        });
      }, { once: true });

      window.addEventListener('anhanga:revoke-consent', function () {
        _consentChoice = 'essential';
        notifyConsentListeners('essential');
        window.dataLayer.push({
          anhanga_marketing_consent: false
        });
        reloadAfterZarazFlush();
      }, { once: true });
    })();
  </script>
