<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>

  <!-- Google Tag Manager (init only, script deferred after load) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Preconnects (Performance) -->
  <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="preconnect" href="https://grainy-gradients.vercel.app">

  <!-- Preload LCP Image -->
  <link rel="preload" as="image"
    href="https://res.cloudinary.com/dzehqrcmm/image/upload/f_auto,q_auto,w_1280,h_720,c_fill/v1771293589/pexels-photo-2868242_hugrsz.jpg">
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap">
  </noscript>

</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T2KGS86G" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <nav class="sr-only" aria-label="Links principais">
    <a href="/">Home</a>
    <a href="/orlando">Orlando</a>
    <a href="/mapa-do-site">Mapa</a>
  </nav>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <!-- Defer third-party scripts to protect mobile TBT -->
  <script>
    (function () {
      var analyticsLoaded = false;
      var hubspotLoaded = false;
      var utmLoaded = false;

      var injectScript = function (src, options) {
        var script = document.createElement('script');
        script.src = src;
        script.async = true;
        if (options && options.defer) script.defer = true;
        if (options && options.id) script.id = options.id;
        if (options && options.type) script.type = options.type;
        document.body.appendChild(script);
      };

      var loadAnalytics = function () {
        if (analyticsLoaded) return;
        analyticsLoaded = true;
        var firstScript = document.getElementsByTagName('script')[0];
        var gtm = document.createElement('script');
        gtm.async = true;
        gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-T2KGS86G';
        if (firstScript && firstScript.parentNode) {
          firstScript.parentNode.insertBefore(gtm, firstScript);
        } else {
          document.body.appendChild(gtm);
        }

        if (!utmLoaded) {
          utmLoaded = true;
          injectScript('/utm-tracking.js', { defer: true });
        }
      };

      var loadHubspot = function () {
        if (hubspotLoaded) return;
        hubspotLoaded = true;
        injectScript('//js.hs-scripts.com/50895604.js', {
          type: 'text/javascript',
          id: 'hs-script-loader',
          defer: true
        });
      };

      var triggerAnalytics = function () {
        loadAnalytics();
      };

      ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function (eventName) {
        window.addEventListener(eventName, triggerAnalytics, { passive: true, once: true });
      });

      if ('requestIdleCallback' in window) {
        requestIdleCallback(function () { setTimeout(triggerAnalytics, 12000); }, { timeout: 25000 });
      } else {
        setTimeout(triggerAnalytics, 15000);
      }

      window.addEventListener('load', function () {
        setTimeout(triggerAnalytics, 12000);
      }, { once: true });

      // HubSpot only after strong conversion intent or long dwell time.
      var contactIntentLoaded = false;
      var triggerHubspot = function () {
        if (contactIntentLoaded) return;
        contactIntentLoaded = true;
        loadAnalytics();
        loadHubspot();
      };

      document.addEventListener('click', function (event) {
        var target = event.target;
        if (!target || !target.closest) return;
        var directIntent = target.closest('a[href^="tel:"],a[href*="wa.me"],a[href*="api.whatsapp.com"],a[href*="#contato"],[data-contact-intent]');
        if (directIntent) {
          triggerHubspot();
          return;
        }
        var btn = target.closest('button,[role="button"]');
        if (!btn) return;
        var hint = ((btn.id || '') + ' ' + (btn.className || '') + ' ' + (btn.textContent || '')).toLowerCase();
        if (hint.indexOf('whatsapp') !== -1 || hint.indexOf('contato') !== -1 || hint.indexOf('orcamento') !== -1) {
          triggerHubspot();
        }
      }, { capture: true });

      var onDeepScroll = function () {
        var doc = document.documentElement;
        var scrollable = Math.max(1, doc.scrollHeight - doc.clientHeight);
        if ((window.scrollY / scrollable) > 0.65) {
          triggerHubspot();
          window.removeEventListener('scroll', onDeepScroll);
        }
      };
      window.addEventListener('scroll', onDeepScroll, { passive: true });

      if ('IntersectionObserver' in window) {
        var observeContactSection = function (attempt) {
          var contactSection = document.getElementById('contato');
          if (!contactSection) {
            if (attempt < 10) setTimeout(function () { observeContactSection(attempt + 1); }, 500);
            return;
          }
          var io = new IntersectionObserver(function (entries) {
            if (entries[0] && entries[0].isIntersecting) {
              triggerHubspot();
              io.disconnect();
            }
          }, { rootMargin: '180px 0px', threshold: 0.05 });
          io.observe(contactSection);
        };
        observeContactSection(0);
      }

      setTimeout(triggerHubspot, 35000);
    })();
  </script>
</body>

</html>
