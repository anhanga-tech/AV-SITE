backend:
  name: github
  repo: anhanga-tech/AV-SITE
  branch: main
  base_url: https://www.anhanga.tur.br
  auth_endpoint: api/auth
  auth_scope: repo

local_backend: true
site_url: https://www.anhanga.tur.br
display_url: https://www.anhanga.tur.br
logo_url: /assets/Anhangá Viagens - logo.png
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    extension: mdx
    format: frontmatter
    slug: '{{slug}}'
    preview_path: blog/{{slug}}
    editor:
      preview: false
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Resumo, name: excerpt, widget: text }
      - { label: Data de publicação, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Data de atualização, name: dateModified, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false }
      - label: Autor
        name: author
        widget: select
        options:
          - { label: Queila de Oliveira, value: queila-oliveira }
          - { label: Felipe William, value: felipe-william }
      - label: Categoria
        name: category
        widget: select
        options:
          - { label: Cruzeiros, value: Cruzeiros }
          - { label: Carnaval, value: Carnaval }
          - { label: Festivais, value: Festivais }
          - { label: Dicas de Expert, value: Dicas de Expert }
          - { label: Planejamento, value: Planejamento }
          - { label: Gastronomia, value: Gastronomia }
          - { label: Romance, value: Romance }
          - { label: Sazonal, value: Sazonal }
      - { label: Imagem de capa, name: image, widget: image, required: true }
      - label: Status do crédito da imagem
        name: imageCreditStatus
        widget: select
        default: confirmed
        hint: Posts novos precisam de crédito confirmado (autor, fonte, licença e adaptação). "Origem em verificação" é reservado ao acervo legado.
        options:
          - { label: Crédito confirmado, value: confirmed }
          - { label: Origem em verificação, value: unknown }
      - { label: Crédito da imagem, name: imageCredit, widget: string, required: false }
      - { label: Fonte original da imagem, name: imageSource, widget: string, required: false }
      - { label: Licença da imagem, name: imageLicense, widget: string, required: false }
      - { label: URL da licença, name: imageLicenseUrl, widget: string, required: false }
      - { label: Adaptação aplicada, name: imageAdaptation, widget: string, required: false }
      - { label: Destaque, name: featured, widget: boolean, required: false, default: false }
      - { label: Mostrar CTA do Chat, name: showChatCTA, widget: boolean, required: false, default: true }
      - { label: Destino do Chat CTA, name: chatCTADestination, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Título SEO, name: seoTitle, widget: string, required: false }
      - { label: Descrição SEO, name: seoDescription, widget: text, required: false }
      - { label: Conteúdo, name: body, widget: markdown }
  - name: achados
    label: Achados da quinzena
    editor:
      preview: false
    files:
      - name: achados
        label: Ofertas da página /achados
        file: content/achados.json
        format: json
        fields:
          - label: Ofertas
            name: achados
            widget: list
            summary: '{{fields.titulo}} (até {{fields.validoAte}})'
            hint: 'A página mostra no máximo 3 ofertas, as de prazo mais curto primeiro. Cada uma sai do ar sozinha no dia seguinte a "Reservas até". Confira se o preço é o de venda ao público antes de publicar.'
            fields:
              - label: Identificador
                name: id
                widget: string
                hint: 'Só letras minúsculas, números e hífen. Exemplo: msc-dezembro'
                pattern: ['^[a-z0-9-]+$', 'Use só letras minúsculas, números e hífen']
              - { label: Título, name: titulo, widget: string }
              - { label: Destino, name: destino, widget: string }
              - { label: Fornecedor, name: fornecedor, widget: string }
              - label: Por que vale
                name: porQueVale
                widget: text
                hint: 'A opinião da Anhangá: por que a oferta vale e para quem.'
              - label: Preço
                name: preco
                widget: string
                required: false
                hint: 'Exatamente como a operadora divulgou, começando por "A partir de". Deixe vazio se não houver preço.'
              - { label: Condições, name: condicoes, widget: text }
              - label: Reservas até
                name: validoAte
                widget: datetime
                format: YYYY-MM-DD
                date_format: YYYY-MM-DD
                time_format: false
              - label: Mensagem do WhatsApp
                name: mensagemWhatsapp
                widget: string
                hint: 'Cite o nome do achado para o atendimento saber de qual oferta a pessoa veio.'
