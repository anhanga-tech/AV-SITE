name: Submodule Guardrail

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-submodules:
    name: Validate submodule metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fail on invalid gitlink/.gitmodules mapping
        shell: bash
        run: |
          set -euo pipefail

          gitlinks="$(git ls-files -s | awk '$1 == "160000" { print $4 }')"

          if [ -z "${gitlinks}" ]; then
            echo "No gitlinks found."
            exit 0
          fi

          if [ ! -f .gitmodules ]; then
            echo "::error::Found gitlink(s) but .gitmodules does not exist."
            while IFS= read -r path; do
              [ -n "${path}" ] && printf ' - %s\n' "${path}"
            done <<< "${gitlinks}"
            exit 1
          fi

          status=0

          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            section="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' 2>/dev/null | awk -v p="$path" '$2 == p { print $1 }' | sed 's/\.path$//' | head -n1)"

            if [ -z "${section}" ]; then
              echo "::error::Missing .gitmodules path entry for gitlink '${path}'."
              status=1
              continue
            fi

            url="$(git config -f .gitmodules --get "${section}.url" || true)"
            if [ -z "${url}" ]; then
              echo "::error::Missing .gitmodules url entry for gitlink '${path}' (${section}.url)."
              status=1
              continue
            fi

            echo "OK: ${path} -> ${section}.url=${url}"
          done <<< "${gitlinks}"

          if [ "${status}" -ne 0 ]; then
            exit 1
          fi
