name: Refresh Google Reviews

on:
  schedule:
    - cron: "0 6 * * 1" # toda segunda 06:00 UTC (~03:00 BRT)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-reviews:
    name: Atualizar data/googleReviews.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          # Não persistir o GITHUB_TOKEN como credencial git no runner: assim os
          # scripts de lifecycle do pnpm install não conseguem lê-lo. O push
          # reautentica explicitamente via token no passo de abertura do PR.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Google reviews
        env:
          OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_CDN_BASE_URL: ${{ secrets.R2_CDN_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run reviews:fetch

      - name: Open PR with updated reviews
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Compara conteúdo ignorando o carimbo `lastFetched`, que muda a cada
          # run. Sem isso, todo run semanal abriria um PR só de timestamp.
          NEW_CONTENT="$(jq -S 'del(.lastFetched)' data/googleReviews.json)"
          OLD_CONTENT="$(git show HEAD:data/googleReviews.json | jq -S 'del(.lastFetched)')"
          if [ "$NEW_CONTENT" = "$OLD_CONTENT" ]; then
            echo "Apenas lastFetched mudou — nenhum review novo. Pulando PR."
            git checkout -- data/googleReviews.json
            exit 0
          fi
          git add data/googleReviews.json
          BRANCH="chore/update-google-reviews-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore: atualiza data/googleReviews.json"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "HEAD:refs/heads/$BRANCH"
          gh pr create \
            --title "chore: atualiza data/googleReviews.json" \
            --body "Atualização automática semanal dos reviews do Google, disparada pelo workflow agendado \`refresh-reviews.yml\`." \
            --base main \
            --head "$BRANCH"
