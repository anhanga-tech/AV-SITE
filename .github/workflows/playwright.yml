name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    - uses: pnpm/action-setup@v6.0.8
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      # In CI only install Chromium to match the CI-only project set in playwright.config.ts
      run: pnpm exec playwright install --with-deps chromium

    - name: Update visual snapshots
      run: pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots
    - name: Commit updated snapshots
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/e2e/visual.spec.ts-snapshots/
        if git diff --staged --quiet; then
          echo "No snapshot changes to commit."
        else
          git commit -m "test: update visual regression baselines [skip ci]"
          # Push to the PR head branch (HEAD_REF is set only on pull_request events)
          if [ -n "$HEAD_REF" ]; then
            git push origin "HEAD:$HEAD_REF"
          else
            git push
          fi
        fi
    - name: Run Playwright tests
      run: pnpm exec playwright test
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
