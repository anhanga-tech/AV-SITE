name: Playwright Tests
on:
  push:
    branches: [ main ]
  # Sem filtro de `branches`: dispara em PRs contra qualquer base, não só `main`.
  # Mesmo motivo documentado em `ci.yml` — `test` é required check, e stacked PRs
  # (gh-stack) têm como base a branch de baixo. Com o filtro, essas PRs ficavam
  # sem o check e presas sem conseguir satisfazê-lo.
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      # In CI only install Chromium to match the CI-only project set in playwright.config.ts.
      # Omit --with-deps to avoid apt-get failures with external Microsoft/Ubuntu repos;
      # GitHub ubuntu-latest already includes necessary dependencies for Chromium.
      run: pnpm exec playwright install chromium
    # Roda `playwright test` cru (não `pnpm test:e2e`) DE PROPÓSITO: o script
    # test:e2e exclui a tag @visual para não poluir o run local (baselines são
    # Linux-only), mas aqui — no CI Linux — os testes visuais devem rodar e
    # gatear. As baselines visuais NÃO são regeradas aqui: um diff visual deve
    # FALHAR o gate. Atualização intencional de snapshots é feita só pelo
    # workflow manual update-snapshots.yml (workflow_dispatch).
    - name: Run Playwright tests
      run: pnpm exec playwright test
    - name: Build prerendered site
      run: pnpm build
      env:
        # Match production media URLs and the responsive home hero preload.
        VITE_MEDIA_ENABLE_TRANSFORMS: 'true'
    - name: Test prerender, hero media, hydration and chunk recovery
      run: pnpm exec playwright test --config playwright.prerender.config.ts
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
