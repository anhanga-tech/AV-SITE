name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.0
    - uses: pnpm/action-setup@v6.0.9
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      # In CI only install Chromium to match the CI-only project set in playwright.config.ts.
      # Omit --with-deps to avoid apt-get failures with external Microsoft/Ubuntu repos;
      # GitHub ubuntu-latest already includes necessary dependencies for Chromium.
      run: pnpm exec playwright install chromium
    # Roda `playwright test` cru (não `pnpm test:e2e`) DE PROPÓSITO: o script
    # test:e2e exclui a tag @visual para não poluir o run local (baselines são
    # Linux-only), mas aqui — no CI Linux — os testes visuais devem rodar e
    # gatear. As baselines visuais NÃO são regeradas aqui: um diff visual deve
    # FALHAR o gate. Atualização intencional de snapshots é feita só pelo
    # workflow manual update-snapshots.yml (workflow_dispatch).
    - name: Run Playwright tests
      run: pnpm exec playwright test
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
