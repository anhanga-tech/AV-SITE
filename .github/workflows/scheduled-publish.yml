# Publica posts agendados: o build de produção do Cloudflare Pages oculta
# posts com `date` futura (ver lib/blog-schedule.js). Este workflow roda todo
# dia de manhã e, quando existe um post cuja data é hoje, dispara o Deploy
# Hook do Pages para rebuildar a main — o rebuild materializa o post no site,
# no sitemap, no feed RSS e no llms.txt.
#
# Setup (uma vez): criar um Deploy Hook no dashboard do Cloudflare Pages
# (av-site → Settings → Builds & deployments → Deploy hooks, branch main) e
# salvar a URL no secret CLOUDFLARE_PAGES_DEPLOY_HOOK_URL do repositório.
name: Scheduled Blog Publish

on:
  schedule:
    - cron: "15 9 * * *" # 06:15 América/São_Paulo (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-rebuild:
    name: Rebuild produção se há post agendado para hoje
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verifica se há post com data de hoje
        id: today
        run: |
          TODAY="$(TZ=America/Sao_Paulo date +%F)"
          echo "Hoje (São Paulo): $TODAY"
          if grep -rlEq "^date: *[\"']?${TODAY}" content/blog --include='*.mdx'; then
            echo "Post agendado para hoje encontrado."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum post agendado para hoje — nada a fazer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # workflow_dispatch sempre dispara o rebuild, para permitir publicação
      # manual fora do horário do cron.
      - name: Dispara Deploy Hook do Cloudflare Pages
        if: steps.today.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret CLOUDFLARE_PAGES_DEPLOY_HOOK_URL não configurado — crie o Deploy Hook no dashboard do Pages e salve a URL como secret do repositório."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" >/dev/null
          echo "Deploy hook disparado — o Cloudflare Pages vai rebuildar a main."
