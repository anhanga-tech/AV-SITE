name: Issue Auto-Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY: ${{ github.event.issue.body }}
            AUTHOR: ${{ github.event.issue.user.login }}

            Analyze this new issue and:
            1. Determine if it's a bug report, feature request, or question
            2. Assess priority (critical, high, medium, low)
            3. Suggest appropriate labels from: bug, enhancement, seo, geo, schema, technical-debt, documentation
            4. Check if it duplicates existing issues

            Available labels in this repo:
            - bug: Something isn't working
            - enhancement: New feature or request
            - seo: Search engine optimization
            - geo: GEO/Local SEO
            - schema: Structured data/schema markup
            - technical-debt: Code maintenance/improvement
            - documentation: Documentation improvements

            Use gh CLI to:
            - `gh issue view [number]` to view the issue
            - `gh search issues "query" --repo ${{ github.repository }}` to find similar issues
            - `gh label list --repo ${{ github.repository }}` to see available labels
            - `gh issue edit [number] --add-label "label1,label2"` to add labels

            Post a comment summarizing your analysis and apply the appropriate labels.
            If it appears to be a duplicate, mention the original issue number.

          claude_args: |
            --allowedTools "Bash(gh issue:*),Bash(gh search:*),Bash(gh label:*)"
