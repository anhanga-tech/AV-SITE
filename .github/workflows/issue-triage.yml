name: Issue Auto-Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      repository-projects: write
    steps:
      - name: Run Issue Triage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail

          title="${ISSUE_TITLE:-}"
          body="${ISSUE_BODY:-}"
          text="$(printf '%s\n%s' "$title" "$body" | tr '[:upper:]' '[:lower:]')"
          labels=()

          add_label() {
            local label="$1"
            for existing in "${labels[@]}"; do
              if [[ "$existing" == "$label" ]]; then
                return
              fi
            done
            labels+=("$label")
          }

          if [[ "$text" =~ critical|critico|alta[[:space:]]+prioridade|high ]]; then
            add_label "priority-high"
          elif [[ "$text" =~ low|baixa ]]; then
            add_label "priority-low"
          else
            add_label "priority-medium"
          fi

          if [[ "$text" =~ seo ]]; then
            add_label "seo"
          fi

          if [[ "$text" =~ geo ]]; then
            add_label "geo"
          fi

          if [[ "$text" =~ schema|json-ld|structured[[:space:]]+data ]]; then
            add_label "schema"
          fi

          if [[ "$text" =~ faq|uvp|copy|content|conteudo ]]; then
            add_label "content"
          fi

          if [[ "$text" =~ performance|lcp|fcp|web[[:space:]]+vitals|renderizacao ]]; then
            add_label "performance"
          fi

          if [[ "$text" =~ bug|erro|falha|broken|crash|regress ]]; then
            issue_type="bug report"
            add_label "bug"
          elif [[ "$text" =~ documentacao|documentation|docs ]]; then
            issue_type="documentation"
            add_label "documentation"
          elif [[ "$text" =~ pergunta|question|duvida ]]; then
            issue_type="question"
            add_label "question"
          else
            issue_type="feature request / improvement"
            add_label "enhancement"
          fi

          label_csv="$(IFS=,; echo "${labels[*]}")"
          if [[ -n "$label_csv" ]]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "$label_csv"
          fi

          if [[ "$title" =~ [Ss][Ee][Oo]|[Gg][Ee][Oo] ]]; then
            project_number="5"
            project_name="SEO & GEO Optimization 2026"
          else
            project_number="4"
            project_name="AV-SITE Project"
          fi

          gh project item-add "$project_number" --owner felipewilliam2 --url "$ISSUE_URL" >/dev/null

          search_query="$(printf '%s' "$title" | sed -E 's/^\[[^]]+\][[:space:]]*//; s/Recriada:[[:space:]]*//I; s/"/\\"/g')"
          duplicates="$(gh search issues "$search_query" --repo "$REPO" --state open --json number,title,url --limit 5 \
            --jq ".[] | select(.number != (${ISSUE_NUMBER} | tonumber)) | \"- #\\(.number): \\(.title) - \\(.url)\"" || true)"

          if [[ -z "$duplicates" ]]; then
            duplicate_summary="Nenhuma duplicata aberta obvia encontrada pela busca automatizada."
          else
            duplicate_summary="$duplicates"
          fi

          comment_file="$(mktemp)"
          cat > "$comment_file" <<EOF
          Triagem automatica concluida.

          - Tipo: ${issue_type}
          - Labels aplicadas: ${label_csv}
          - Projeto: #${project_number} (${project_name})

          Possiveis duplicatas:
          ${duplicate_summary}
          EOF

          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$comment_file"
