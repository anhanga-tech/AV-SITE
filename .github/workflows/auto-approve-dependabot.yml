name: Auto approve Dependabot PRs

on: pull_request_target

permissions: {}

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Pinado em SHA: o job roda em `pull_request_target` com `pull-requests: write`,
      # então uma tag re-apontada executaria código de terceiro com esse token.
      - uses: hmarr/auto-approve-action@05a696a09d381a5a0d142c755f7eacbb19eb6525 # v4
