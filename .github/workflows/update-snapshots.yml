name: Update Playwright Snapshots
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: true
        default: 'main'
permissions:
  contents: write
jobs:
  update-snapshots:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
      with:
        ref: ${{ github.event.inputs.branch }}
        token: ${{ secrets.GITHUB_TOKEN }}
    - uses: pnpm/action-setup@v6.0.9
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium
    - name: Update visual snapshots
      run: pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots
    - name: Commit updated snapshots
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/e2e/visual.spec.ts-snapshots/
        if git diff --staged --quiet; then
          echo "No snapshot changes to commit."
        else
          git commit -m "test: update visual regression baselines [skip ci]"
          git push
        fi
