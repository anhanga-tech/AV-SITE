name: Dependency Review

# Bloqueia PRs que introduzam dependências com vulnerabilidades conhecidas ou
# licenças problemáticas. Complementa o Dependabot (que faz bumps), atuando como
# gate no momento em que a dependência é proposta.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Falha o PR a partir de severidade "high" (ajustar para "moderate" se
          # quiser um gate mais rígido).
          fail-on-severity: high
          comment-summary-in-pr: on-failure
