name: Dependency Review

# Bloqueia PRs que introduzam dependências com vulnerabilidades conhecidas ou
# licenças problemáticas. Complementa o Dependabot (que faz bumps), atuando como
# gate no momento em que a dependência é proposta.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Falha o PR a partir de severidade "high" (ajustar para "moderate" se
          # quiser um gate mais rígido).
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # GHSA-qwww-vcr4-c8h2: CSRF em modo RSC do react-router (>= 7.12.0, < 8.3.0).
          # Só afeta apps usando as APIs instáveis de React Server Components — este
          # projeto é Vite/React 19 client-side puro, sem RSC. O patch real exige
          # bump major (7.x -> 8.x, breaking). Reavaliar ao migrar para react-router 8.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
