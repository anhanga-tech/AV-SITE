name: CI
permissions:
  contents: read
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed so `git diff` in scripts/lint-changed.ts can reach the PR
          # base / previous push commit — a shallow clone can't diff against it.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Node version check
        run: node -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint changed files
        env:
          # PR base commit vs. the previous push commit — both are SHAs, passed
          # via env (not interpolated into the shell) per the repo's workflow
          # command-injection guard (tests/workflow-command-injection-guard.test.ts).
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            export LINT_BASE_REF="$PR_BASE_SHA"
          else
            export LINT_BASE_REF="$PUSH_BEFORE_SHA"
          fi
          pnpm run lint:changed

      - name: Run tests
        run: pnpm run test:regression

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Check bundle size
        run: pnpm run test:size

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
