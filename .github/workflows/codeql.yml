name: CodeQL
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,typescript,python
          # optional: config-file: .github/codeql/codeql-config.yml

      - name: Autobuild (recommended)
        uses: github/codeql-action/autobuild@v3
        # Se tiver um build custom, substitua a step acima por:
        # - name: Autobuild (manual)
        #   run: |
        #     npm ci
        #     npm run build --if-present

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: (optional) Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          # sarif_file: results.sarif # deixe em branco para upload automático
