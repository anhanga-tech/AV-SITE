overrides:
  rimraf: "^6.1.3"
  glob: "^13.0.6"
  # eslint-plugin-jsx-a11y 6.x still consumes the CommonJS API from minimatch 3.
  # 3.1.5 is the security backport for GHSA-3ppc-4f35-3m26; a global 10.x
  # override breaks label-has-associated-control at runtime.
  "minimatch@3": "^3.1.5"
  qs: "^6.15.2"
  # Dependabot #35 (medium): protobufjs <= 7.6.2 schema-property shadowing.
  # Transitivo via @google/genai (SDK do Gemini, produção). 7.6.3 corrige.
  # Pinado na linha 7.6.x: a 8.x não tem trusted publisher e viola no-downgrade.
  protobufjs: ">=7.6.3 <8"
  # Dependabot #31 (low): esbuild < 0.28.1 permite leitura arbitrária de
  # arquivos via dev-server no Windows. Transitivo (wrangler + vite/tsx).
  # 0.28.1 corrige; força as duas árvores (0.27.3 e 0.28.0) para a versão segura.
  # Pinado em ^0.28.1 (>=0.28.1 <0.29.0): esbuild é pré-1.0, minor bumps são
  # breaking pelo SemVer e poderiam quebrar vite/wrangler/tsx.
  esbuild: "^0.28.1"
  # pnpm audit (high): GHSA-96hv-2xvq-fx4p — ws < 8.21.0 sofre DoS por
  # exaustão de memória com fragmentos/chunks minúsculos. Transitivo via
  # wrangler > miniflare (runtime de dev local). 8.21.0 corrige.
  ws: "^8.21.0"
  # pnpm audit (high/moderate/low): GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q,
  # GHSA-hm92-r4w5-c3mj, GHSA-pr7r-676h-xcf6, GHSA-p88m-4jfj-68fv,
  # GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m — undici 7.x < 7.28.0
  # (bypass de validação TLS, DoS WebSocket, vazamento entre origens,
  # injeção de header/cookie). Transitivo via wrangler > miniflare.
  # Dependabot #53-57 (high/moderate): mesma árvore, novos GHSAs em cache
  # HTTP (desync de resposta, injeção de header/cookie via Cache-Control e
  # setCookie, CRLF via body 'type'). undici@7.29.0 (publicado 2026-07-24,
  # cooldown vencido em 2026-07-31) corrige; pinado em ^7.29.0.
  undici: "^7.29.0"
  # Dependabot #45 (moderate): GHSA-h67p-54hq-rp68 — DoS quadrático em merge
  # keys do js-yaml via aliases repetidos. Transitivo build/dev-time via
  # gray-matter (scripts/blog-manifest) e bundlesize2 > cosmiconfig@5 — ambos
  # na linha 3.x, que usa a API yaml.safeLoad. O backport js-yaml@3.15.0
  # (dist-tag v3-legacy, publicado 2026-06-26, cooldown de 7 dias vencido em
  # 2026-07-03) corrige na própria linha 3.x e preserva safeLoad.
  # Override escopado a "@3" de propósito: um override global rebaixaria a
  # árvore js-yaml@4.2.0 (cosmiconfig@9), que já está corrigida e usa a API v4.
  "js-yaml@3": "^3.15.0"
  # Issue #1138 (high): @ungap/structured-clone < 1.3.1 tem resolução CWE-502
  # depreciada. Transitivo via mdast-util-to-hast (react-markdown, caminho do
  # chatbot, e @mdx-js/mdx, caminho do blog). 1.3.2 corrige; override escopado
  # a "@1" porque só existe uma major (1.x) na árvore.
  "@ungap/structured-clone@1": "^1.3.2"
  # Dependabot #47 (high): sharp < 0.35.0 herda CVEs da libvips
  # (CVE-2026-33327/33328/35590/35591). Transitivo via wrangler > miniflare
  # (runtime de dev local), pinado em 0.34.5 no package.json da própria
  # miniflare. O bump nativo (miniflare 4.20260722.0) só saiu em 2026-07-23 e
  # ainda está em cooldown (minimumReleaseAge); override global para 0.35.3
  # unifica com a versão já usada como dependência direta (scripts de imagem).
  sharp: "^0.35.3"
  # Dependabot #48 (high): GHSA-v2hh-gcrm-f6hx — fast-uri <= 4.1.0 não trata
  # `\` como delimitador de authority, gerando host confusion entre o parser
  # de fast-uri e a WHATWG URL nativa do Node (fetch/undici), risco de SSRF.
  # Transitivo via ajv (react-doctor > conf > ajv-formats), só dev. 3.1.4
  # corrige; override escopado a "@3" porque só existe a linha 3.x na árvore.
  "fast-uri@3": "^3.1.4"
  # pnpm audit (low): GHSA-v422-hmwv-36x6 — body-parser < 1.20.6 desabilita
  # silenciosamente o enforcement de tamanho quando recebe um `limit` inválido
  # (DoS). Transitivo dev-only via decap-server > express@4 > body-parser
  # (proxy local do Decap CMS, `pnpm cms:proxy`). 1.20.6 corrige; escopado a
  # "@1" porque express 4.x consome a linha 1.x — a 2.x quebraria a API.
  "body-parser@1": "^1.20.6"

legacyPeerDeps: true
nodeLinker: hoisted
minimumReleaseAge: 10080
blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
onlyBuiltDependencies:
  - "@google/genai"
  - esbuild
  - protobufjs
  - sharp
  - workerd
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
