overrides:
  rimraf: "^6.1.3"
  glob: "^13.0.6"
  # eslint-plugin-jsx-a11y 6.x still consumes the CommonJS API from minimatch 3.
  # 3.1.5 is the security backport for GHSA-3ppc-4f35-3m26; a global 10.x
  # override breaks label-has-associated-control at runtime.
  "minimatch@3": "^3.1.5"
  qs: "^6.15.2"
  # Dependabot #35 (medium): protobufjs <= 7.6.2 schema-property shadowing.
  # Transitivo via @google/genai (SDK do Gemini, produção). 7.6.3 corrige.
  # Pinado na linha 7.6.x: a 8.x não tem trusted publisher e viola no-downgrade.
  protobufjs: ">=7.6.3 <8"
  # Dependabot #31 (low): esbuild < 0.28.1 permite leitura arbitrária de
  # arquivos via dev-server no Windows. Transitivo (wrangler + vite/tsx).
  # 0.28.1 corrige; força as duas árvores (0.27.3 e 0.28.0) para a versão segura.
  # Pinado em ^0.28.1 (>=0.28.1 <0.29.0): esbuild é pré-1.0, minor bumps são
  # breaking pelo SemVer e poderiam quebrar vite/wrangler/tsx.
  esbuild: "^0.28.1"
  # pnpm audit (high): GHSA-96hv-2xvq-fx4p — ws < 8.21.0 sofre DoS por
  # exaustão de memória com fragmentos/chunks minúsculos. Transitivo via
  # wrangler > miniflare (runtime de dev local). 8.21.0 corrige.
  ws: "^8.21.0"
  # pnpm audit (high/moderate/low): GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q,
  # GHSA-hm92-r4w5-c3mj, GHSA-pr7r-676h-xcf6, GHSA-p88m-4jfj-68fv,
  # GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m — undici 7.x < 7.28.0
  # (bypass de validação TLS, DoS WebSocket, vazamento entre origens,
  # injeção de header/cookie). Transitivo via wrangler > miniflare.
  # Dependabot #53-57 (high/moderate): mesma árvore, novos GHSAs em cache
  # HTTP (desync de resposta, injeção de header/cookie via Cache-Control e
  # setCookie, CRLF via body 'type'). undici@7.29.0 (publicado 2026-07-24,
  # cooldown vencido em 2026-07-31) corrige; pinado em ^7.29.0.
  undici: "^7.29.0"
  # Dependabot #45 (moderate): GHSA-h67p-54hq-rp68 — DoS quadrático em merge
  # keys do js-yaml via aliases repetidos. Transitivo build/dev-time via
  # gray-matter (scripts/blog-manifest) e bundlesize2 > cosmiconfig@5 — ambos
  # na linha 3.x, que usa a API yaml.safeLoad.
  # pnpm audit (high): CVE-2026-59870 — DoS quadrático adicional na resolução
  # de `!!omap` (fix não retroportado para 3.15.0). js-yaml@3.15.1 (dist-tag
  # v3-legacy, publicado 2026-07-31, cooldown de 7 dias vencido em 2026-08-07)
  # corrige as duas falhas na própria linha 3.x e preserva safeLoad.
  # Dependabot #74/#75 (high): GHSA-2883-xcg3-v3hh — maxTotalMergeKeys não
  # limita o CPU quando as merge sources são vazias (DoS quadrático que
  # contorna a mitigação de GHSA-h67p-54hq-rp68). Atinge as duas linhas
  # presentes na árvore: 3.15.1 (gray-matter, bundlesize2 > cosmiconfig@5) e
  # 4.3.1 (semantic-release > cosmiconfig@9). 3.15.2 e 4.3.2 (ambas
  # publicadas em 2026-08-26, cooldown de 7 dias vencido em 2026-09-02)
  # corrigem. Os overrides seguem escopados por major de propósito: um
  # override global rebaixaria a árvore 4.x, que usa a API v4, para a 3.x,
  # que expõe safeLoad.
  "js-yaml@3": "^3.15.2"
  "js-yaml@4": "^4.3.2"
  # Issue #1138 (high): @ungap/structured-clone < 1.3.1 tem resolução CWE-502
  # depreciada. Transitivo via mdast-util-to-hast (react-markdown, caminho do
  # chatbot, e @mdx-js/mdx, caminho do blog). 1.3.2 corrige; override escopado
  # a "@1" porque só existe uma major (1.x) na árvore.
  "@ungap/structured-clone@1": "^1.3.2"
  # Dependabot #47 (high): sharp < 0.35.0 herda CVEs da libvips
  # (CVE-2026-33327/33328/35590/35591). Transitivo via wrangler > miniflare
  # (runtime de dev local), pinado em 0.34.5 no package.json da própria
  # miniflare. O bump nativo (miniflare 4.20260722.0) só saiu em 2026-07-23 e
  # ainda está em cooldown (minimumReleaseAge); override global para 0.35.3
  # unifica com a versão já usada como dependência direta (scripts de imagem).
  sharp: "^0.35.3"
  # Dependabot #48 (high): GHSA-v2hh-gcrm-f6hx — fast-uri <= 4.1.0 não trata
  # `\` como delimitador de authority, gerando host confusion entre o parser
  # de fast-uri e a WHATWG URL nativa do Node (fetch/undici), risco de SSRF.
  # Transitivo via ajv (react-doctor > conf > ajv-formats), só dev. 3.1.4
  # corrige; override escopado a "@3" porque só existe a linha 3.x na árvore.
  # pnpm audit (moderate): GHSA-hrr3-gc8f-f4qj — fast-uri < 3.1.8 normaliza
  # host de forma inconsistente para octetos percent-encoded, mesma árvore
  # dev-only acima. 3.1.8 (publicado 2026-09-15, cooldown vencido em
  # 2026-09-22) corrige.
  "fast-uri@3": "^3.1.8"
  # pnpm audit (low): GHSA-v422-hmwv-36x6 — body-parser < 1.20.6 desabilita
  # silenciosamente o enforcement de tamanho quando recebe um `limit` inválido
  # (DoS). Transitivo dev-only via decap-server > express@4 > body-parser
  # (proxy local do Decap CMS, `pnpm cms:proxy`). 1.20.6 corrige; escopado a
  # "@1" porque express 4.x consome a linha 1.x — a 2.x quebraria a API.
  "body-parser@1": "^1.20.6"
  # pnpm audit (high): GHSA-2v37-7h3g-55p8 — nanoid < 3.3.18 loops
  # indefinitely when a custom generator receives size 0 (CWE-835 DoS).
  # Transitivo via postcss (build/dev-time: tailwindcss, autoprefixer,
  # vite). nanoid@3.3.18 (publicado 2026-08-07, cooldown de 7 dias vencido
  # em 2026-08-14) corrige; só existe a linha 3.x na árvore, então o
  # override global não rebaixa nada.
  nanoid: "^3.3.18"
  # pnpm audit (high): GHSA-mh99-v99m-4gvg + GHSA-rgw5-rvv9-x895 — DoS por
  # expansão de chaves não limitada em brace-expansion < 1.1.18 (a segunda
  # falha contorna a mitigação da primeira). Transitivo dev-only via
  # eslint-plugin-jsx-a11y > minimatch@3 (linha 1.x). brace-expansion@1.1.18
  # (publicado 2026-07-30, cooldown de 7 dias vencido em 2026-08-06) corrige
  # ambas; escopado a "@1" porque a árvore também tem brace-expansion@5.x
  # (já corrigida) em outro caminho de dependência.
  # pnpm audit (high): GHSA-qhr7-859c-m2p7 (<1.1.20), GHSA-6j4f-fj2g-mc7p
  # (<1.1.19) e GHSA-q2hr-2g5m-vwhr (<1.1.21) — três novos DoS por expansão
  # de chaves/recursão não limitada na própria linha 1.x, publicados depois
  # do pin acima. brace-expansion@1.1.21 (publicado 2026-09-14, cooldown de
  # 7 dias vencido em 2026-09-21) corrige as três.
  "brace-expansion@1": "^1.1.21"
  # pnpm audit (high/moderate): mesmos três GHSAs acima, versão da linha 5.x
  # consumida por eslint (minimatch@10 > brace-expansion@5, caminho
  # @eslint/config-array e eslint core) e por bundlesize2 > glob > minimatch.
  # brace-expansion@5.0.12 (publicado 2026-09-14, cooldown vencido em
  # 2026-09-21) corrige; escopado a "@5" pelo mesmo motivo do pin acima — a
  # árvore tem as duas majors em caminhos de dependência diferentes.
  "brace-expansion@5": "^5.0.12"
  # pnpm audit (high): GHSA-c83g-rgw3-j3cx (crescimento de memória não
  # limitado via resultados de query distintos, sem eviction de cache) +
  # GHSA-73wf-gq98-2v4g (crash / escrita em prototype não capturada via
  # browserslist-stats.json não confiável) — browserslist <= 4.28.6.
  # Transitivo build-time via autoprefixer (dependência direta, pipeline
  # Tailwind/PostCSS) e @babel/core (dev, via eslint-plugin-react-hooks >
  # react-doctor). 4.28.7 corrige ambas; usamos ^4.28.7 (não pin exato) para
  # deixar minimumReleaseAge escolher a mais recente já fora do cooldown de
  # 7 dias.
  browserslist: "^4.28.7"
  # Dependabot #73 (low): GHSA-6w3j-5fw6-r9vr — prototype pollution via chave
  # de linguagem `__proto__` em mensagens customizadas do joi. Transitivo
  # dev-only via decap-server (proxy local do Decap CMS, `pnpm cms:proxy`).
  # O namespace @hapi/joi foi abandonado em 17.1.1 e não recebeu correção; o
  # fix só existe no pacote renomeado `joi` (17.13.6+). O override usa alias
  # npm para a linha 17.x, que é a continuação direta de @hapi/joi@17 e
  # mantém a mesma API. ^17.13.6 deixa minimumReleaseAge escolher a mais
  # recente já fora do cooldown de 7 dias.
  "@hapi/joi": "npm:joi@^17.13.6"
  # pnpm audit (critical): GHSA-x6jw-m9v5-85vh — guard de operações inseguras
  # do simple-git >=3.15.0 <4.0.1 não bloqueia config de comando de trailer.
  # pnpm audit (high): GHSA-g4wm-2vf7-vfgr (execução de comando via config
  # git não bloqueada) + GHSA-858h-whjf-mvg5 (bypass do plugin
  # unsafe-operations via abreviação de long-option) — simple-git <= 3.36.0.
  # pnpm audit (critical): GHSA-v5rq-49vh-5v5c — @simple-git/argv-parser
  # < 2.0.1 omite a env var VISUAL da checagem de editor inseguro.
  # Transitivo dev-only via decap-server > simple-git (proxy local do Decap
  # CMS, `pnpm cms:proxy`). decap-server@3.11.3 declara simple-git ^3.0.0,
  # mas não existe 3.x >= 3.36.1 (a linha 3.x parou em 3.36.0) — o fix só
  # existe na 4.x. simple-git@4.0.2 (publicado 2026-09-26, cooldown de 7
  # dias vencido em 2026-10-03) corrige as três e já fixa
  # @simple-git/argv-parser@2.0.1, então o argv-parser não precisa de
  # override próprio. É um major bump forçado sobre decap-server (nem o
  # 3.11.3-beta.1 sobe o range). Validado: `pnpm cms:proxy` roda no modo
  # padrão MODE=fs, que só carrega o simple-git sem invocá-lo — info,
  # entriesByFolder, persistEntry, getEntry e deleteFile funcionam.
  # LIMITAÇÃO CONHECIDA: MODE=git (não usado neste repo) quebra no startup
  # com "(0, l.default) is not a function" — o CJS da 4.x exporta um objeto
  # sem `default`, e o bundle do decap-server chama o default do módulo.
  # Remover este override quando o decap-server declarar simple-git ^4.
  # Escopado a "@3" para remapear só o range ^3 que decap-server pede.
  "simple-git@3": "^4.0.2"
  # pnpm audit (moderate): GHSA-rj75-hqrm-r3gf — complexidade quadrática no
  # parse de seletores planos permite exaustão de CPU em
  # postcss-selector-parser < 7.1.6. Transitivo build-time via
  # @tailwindcss/typography@0.5.20, que fixa a versão exata 6.0.10 (a linha
  # 6.x não recebeu backport). 7.1.6 (publicado 2026-09-03, cooldown vencido
  # em 2026-09-10) corrige; é major bump forçado, mas o plugin só usa
  # parser().astSync e a travessia de nodes, API estável na 7.x — o CSS
  # gerado pelo build ficou idêntico. Escopado a "@6" porque é a única major
  # na árvore e o consumidor pede 6.x.
  "postcss-selector-parser@6": "^7.1.6"

legacyPeerDeps: true
nodeLinker: hoisted
minimumReleaseAge: 10080
blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
onlyBuiltDependencies:
  - "@google/genai"
  - esbuild
  - protobufjs
  - sharp
  - workerd
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
