overrides:
  rimraf: "^6.1.3"
  glob: "^13.0.6"
  minimatch: "^10.2.2"
  qs: "^6.15.2"
  # Dependabot #35 (medium): protobufjs <= 7.6.2 schema-property shadowing.
  # Transitivo via @google/genai (SDK do Gemini, produção). 7.6.3 corrige.
  # Pinado na linha 7.6.x: a 8.x não tem trusted publisher e viola no-downgrade.
  protobufjs: ">=7.6.3 <8"
  # Dependabot #31 (low): esbuild < 0.28.1 permite leitura arbitrária de
  # arquivos via dev-server no Windows. Transitivo (wrangler + vite/tsx).
  # 0.28.1 corrige; força as duas árvores (0.27.3 e 0.28.0) para a versão segura.
  # Pinado em ^0.28.1 (>=0.28.1 <0.29.0): esbuild é pré-1.0, minor bumps são
  # breaking pelo SemVer e poderiam quebrar vite/wrangler/tsx.
  esbuild: "^0.28.1"
  # pnpm audit (high): GHSA-96hv-2xvq-fx4p — ws < 8.21.0 sofre DoS por
  # exaustão de memória com fragmentos/chunks minúsculos. Transitivo via
  # wrangler > miniflare (runtime de dev local). 8.21.0 corrige.
  ws: "^8.21.0"
  # pnpm audit (high/moderate/low): GHSA-vmh5-mc38-953g, GHSA-vxpw-j846-p89q,
  # GHSA-hm92-r4w5-c3mj, GHSA-pr7r-676h-xcf6, GHSA-p88m-4jfj-68fv,
  # GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m — undici 7.x < 7.28.0
  # (bypass de validação TLS, DoS WebSocket, vazamento entre origens,
  # injeção de header/cookie). Transitivo via wrangler > miniflare.
  # 7.28.0 corrige; pinado em ^7.28.0 (mesma major).
  undici: "^7.28.0"
  # PENDENTE: GHSA-h67p-54hq-rp68 (moderate, DoS quadrático em merge keys do
  # js-yaml via aliases repetidos). Transitivo build/dev-time via gray-matter
  # (scripts/blog-manifest) e bundlesize2 > cosmiconfig — ambos na linha 3.x,
  # que usa a API yaml.safeLoad. Resolvido instalado: js-yaml@3.14.2 (vulnerável).
  #
  # CORREÇÃO conhecida (atualiza nota anterior que dizia ser inviável): existe o
  # backport js-yaml@3.15.0 (dist-tag v3-legacy, publicado 2026-06-26) que corrige
  # NA PRÓPRIA linha 3.x e preserva safeLoad — logo NÃO quebra o gray-matter.
  # O override correto é:  js-yaml: "^3.15.0"  (>=3.15.0 <4, mantém major 3.x).
  #
  # BLOQUEIO temporário: 3.15.0 ainda está dentro da janela `minimumReleaseAge`
  # (10080 min / 7 dias) desta config — `pnpm install` rejeita com
  # ERR_PNPM_NO_MATURE_MATCHING_VERSION até ~2026-07-03. Adotar o override acima
  # quando a versão amadurecer (não burlar o cooldown via exclude para um release
  # de poucos dias). Risco até lá: build/dev-time apenas, moderate, já na main.

legacyPeerDeps: true
nodeLinker: hoisted
minimumReleaseAge: 10080
blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
onlyBuiltDependencies:
  - "@google/genai"
  - esbuild
  - protobufjs
  - sharp
  - workerd
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
